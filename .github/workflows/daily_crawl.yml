name: Daily Opposition Watch

on:
  schedule:
    # 目标：贝尔格莱德 20:00
    # GitHub cron 只用 UTC，夏令时(CEST)=UTC 18:00；冬令时会变成当地 19:00
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "监测日 YYYY-MM-DD（留空=贝尔格莱德今天）"
        required: false
        default: ""
      dry_run:
        description: "仅抓取粗筛，不调用 Kimi（true/false）"
        required: false
        default: "false"

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL || 'speechlessgorilla@gmail.com' }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TZ: Europe/Belgrade
        run: python main.py

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/
          git commit -m "Add daily report for $(date +'%Y-%m-%d')" || echo "No changes"
          git push
